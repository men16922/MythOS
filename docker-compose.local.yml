# Local MythOS infrastructure.
#
# Stateful stores and developer tooling only. Ollama and the FLUX worker run on
# the Mac host (Metal/MPS), not in Docker. See docs/DESIGN.md sections 3 and 6.
#
#   make infra-up      bring everything up
#   make infra-ps      see status
#   make infra-down    stop and remove containers
#   make infra-reset   stop and wipe .docker/ volume data
#
# Defaults below mirror docs/DESIGN.md and .env.example. They can be overridden
# from .env (Compose loads it automatically from this directory).

name: mythos-local

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mythos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mythos}
      POSTGRES_DB: ${POSTGRES_DB:-mythos}
    ports:
      - "5432:5432"
    volumes:
      - ./.docker/postgres:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mythos} -d ${POSTGRES_DB:-mythos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-mythos}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-mythos-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.docker/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot bucket bootstrap. Runs after MinIO is healthy, creates the buckets,
  # then exits. Decision: bucket creation lives here as a mc init container so the
  # stack is self-contained (no separate host bootstrap script to remember).
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mythos}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-mythos-local-secret}
      S3_BUCKET_ASSETS: ${S3_BUCKET_ASSETS:-mythos-assets}
      S3_BUCKET_EXPORTS: ${S3_BUCKET_EXPORTS:-mythos-session-exports}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" &&
      mc mb --ignore-existing local/\"$$S3_BUCKET_ASSETS\" &&
      mc mb --ignore-existing local/\"$$S3_BUCKET_EXPORTS\" &&
      echo 'minio buckets ready'
      "
    restart: "no"

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./.docker/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Web UI for Redis (the Adminer-equivalent for keys/lists). http://localhost:8081
  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
    # OTLP receivers (4317/4318) stay internal; the otel-collector forwards to
    # jaeger:4317 over the compose network so the host ports are free for the
    # collector itself.
