# Local Mythos 2.0 infrastructure: Postgres for the /api/v2 save store (+ Adminer to look at it).
# The API also runs without it (in-memory saves). Ollama (the local AI GM) runs on the host, not in Docker.
#
#   make infra-up      bring everything up
#   make infra-ps      see status
#   make infra-down    stop and remove containers
#   make infra-reset   stop and wipe .docker/ volume data
#
# Defaults can be overridden from .env (Compose loads it automatically from this directory).

name: mythos-local

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mythos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mythos}
      POSTGRES_DB: ${POSTGRES_DB:-mythos}
    ports:
      - "5432:5432"
    volumes:
      - ./.docker/postgres:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mythos} -d ${POSTGRES_DB:-mythos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
