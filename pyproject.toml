[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mythos-local-image-agent"
version = "0.1.0"
description = "Local Ollama + FLUX.1 schnell image generation agent for Project MythOS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.33.0",
    "boto3>=1.34.0",
    "diffusers>=0.31.0",
    "huggingface-hub>=1.0.0",
    "mflux>=0.17.0",
    "numpy<2.5",
    "openai>=1.40.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-exporter-otlp-proto-http>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "pillow>=10.4.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "protobuf>=4.25.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.1",
    "safetensors>=0.4.4",
    "sentencepiece>=0.2.0",
    "streamlit>=1.36.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.44.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "playwright>=1.40.0",
    "google-genai>=1.0.0",
    "google-cloud-storage>=2.18.0",
]
# P3 Web UI decoupling: FastAPI backend adapter over RuntimeSessionService.
# Optional so the core runtime / image agent install stays lean.
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
]
# Cloud product LLM (GCP closed beta): Gemini / Vertex AI narrative provider.
# Optional so the local dev install (Ollama path) needs no Google SDK or creds.
# Selected at runtime via MYTHOS_NARRATIVE_PROVIDER=gemini|vertex. google-genai
# also powers the Vertex Imagen image path (MYTHOS_VISUAL_PROVIDER=vertex).
gemini = [
    "google-genai>=1.0.0",
]
# Cloud asset storage: Google Cloud Storage adapter (MYTHOS_STORAGE_BACKEND=gcs).
gcs = [
    "google-cloud-storage>=2.18.0",
]
# Convenience aggregate for the full GCP closed-beta deploy (Gemini + Imagen + GCS +
# Cloud Trace). MYTHOS_TRACE_BACKEND=gcp uses the Cloud Trace exporter.
gcp = [
    "google-genai>=1.0.0",
    "google-cloud-storage>=2.18.0",
    "opentelemetry-exporter-gcp-trace>=1.7.0",
]

[project.scripts]
mythos-image-agent = "mythos_image_agent.cli:main"
mythos-api = "mythos_api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mythos_api = ["static/*", "static/assets/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts/gen_bgm.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true

# mypy's `strict = true` override key leaks strict-mode checks (e.g.
# disallow_untyped_defs) to every module in the run, not just the ones matched
# here (reproduced on mypy 2.1.0: a bogus non-matching module glob with
# `strict = true` still made unrelated files fail). Spell out the per-module
# strict flags instead (mypy's own definition minus warn_redundant_casts,
# which PER_MODULE_OPTIONS does not support scoping).
[[tool.mypy.overrides]]
module = ["mythos_memory.*", "mythos_combat.*", "mythos_api.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
implicit_reexport = false
