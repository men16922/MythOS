[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mythos"
version = "2.0.0"
description = "Mythos 2.0 (세계:접속 — Signal Run): web server for the browser game (SPA + /api/v2 saves and AI GM)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",          # OpenAI-compatible local GM endpoint (Ollama / MLX / vLLM)
    "google-genai>=1.0.0",     # Gemini / Vertex GM (MYTHOS_NARRATIVE_PROVIDER=vertex)
    "psycopg[binary]>=3.2.0",  # v2_saves (Postgres; falls back to memory without a DB)
    "psycopg-pool>=3.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "playwright>=1.40.0",      # headless browser smoke (scripts/e2e_v2.py)
    "pillow>=10.4.0",          # asset pipeline (scripts/v2_assets)
    "numpy>=1.26",
]

[project.scripts]
mythos-api = "mythos_api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mythos_api = ["static/*", "static/assets/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C4", "SIM", "PERF", "B", "RUF100", "RET", "PIE", "FURB", "FLY", "PYI", "G", "N", "RUF005", "RUF007", "RUF012", "RUF022", "RUF059", "PTH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
