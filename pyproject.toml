[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mythos-local-image-agent"
version = "0.1.0"
description = "Local Ollama + FLUX.1 schnell image generation agent for Project MythOS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.33.0",
    "boto3>=1.34.0",
    "diffusers>=0.31.0",
    "huggingface-hub>=1.0.0",
    "mflux>=0.17.0",
    "openai>=1.40.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-exporter-otlp-proto-http>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "pillow>=10.4.0",
    "psycopg[binary]>=3.2.0",
    "protobuf>=4.25.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.1",
    "safetensors>=0.4.4",
    "sentencepiece>=0.2.0",
    "streamlit>=1.36.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.44.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
# P3 Web UI decoupling: FastAPI backend adapter over RuntimeSessionService.
# Optional so the core runtime / image agent install stays lean.
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
]

[project.scripts]
mythos-image-agent = "mythos_image_agent.cli:main"
mythos-api = "mythos_api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts/gen_bgm.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
