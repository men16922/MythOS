<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MythOS — Tester Dashboard</title>
<style>
:root {
  --bg: #0a0f0d;
  --surface: rgba(0, 20, 17, 0.8);
  --card: rgba(0, 20, 17, 0.6);
  --term: #00ffaa;
  --term-dim: #00cc88;
  --ink: #d6fff6;
  --ink-dim: #6b8f85;
  --line: rgba(0, 255, 170, 0.15);
  --line-soft: rgba(255, 255, 255, 0.08);
  --green: #4ade80;
  --blue: #60a5fa;
  --pink: #f472b6;
  --amber: #fbbf24;
  --mono: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  padding: 24px;
  min-height: 100vh;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}

.header h1 {
  font-size: 20px;
  color: var(--term);
  font-family: var(--mono);
  font-weight: 600;
}

.summary-bar {
  display: flex;
  gap: 20px;
  font-size: 12px;
  align-items: center;
}

.summary-bar span { color: var(--ink-dim); }
.summary-bar strong { color: var(--ink); }

.btn {
  background: rgba(0, 255, 170, 0.1);
  border: 1px solid var(--term);
  border-radius: 4px;
  color: var(--term);
  font-size: 11px;
  padding: 4px 12px;
  cursor: pointer;
  font-family: var(--mono);
}
.btn:hover { background: rgba(0, 255, 170, 0.2); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
  gap: 16px;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line-soft);
}

.card-name {
  display: flex;
  align-items: center;
  gap: 8px;
}

.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--ink-dim);
}
.dot.active { background: var(--green); box-shadow: 0 0 6px #4ade8088; }

.name { font-size: 14px; font-weight: bold; color: var(--ink); }
.key { font-size: 10px; color: var(--ink-dim); font-family: var(--mono); }

.chip {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  font-family: var(--mono);
}
.chip-blue { background: rgba(96,165,250,0.15); border: 1px solid rgba(96,165,250,0.3); color: var(--blue); }
.chip-pink { background: rgba(244,114,182,0.15); border: 1px solid rgba(244,114,182,0.3); color: var(--pink); }
.chip-amber { background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.3); color: var(--amber); }

.stats-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.stat-box {
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 60px;
}

.stat-label { font-size: 10px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 18px; font-weight: bold; font-family: var(--mono); color: var(--ink); line-height: 1; }

.active-loop {
  background: rgba(74,222,128,0.05);
  border: 1px solid rgba(74,222,128,0.2);
  border-radius: 6px;
  padding: 10px;
}

.active-loop-title { font-size: 11px; color: var(--green); font-weight: bold; margin-bottom: 6px; }

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  font-size: 11px;
}
.detail-grid .label { color: var(--ink-dim); }
.detail-grid .value { color: var(--ink); }

.section-title {
  font-size: 10px;
  color: var(--term-dim);
  font-weight: bold;
  margin-bottom: 4px;
  text-transform: uppercase;
}

.endings-allies {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.mini-panel {
  padding: 6px;
  background: rgba(0,0,0,0.2);
  border-radius: 4px;
  border: 1px solid var(--line-soft);
  min-height: 30px;
}

.ending-item { font-size: 10px; color: var(--amber); margin-bottom: 2px; }
.ally-chip { font-size: 10px; background: rgba(96,165,250,0.15); border: 1px solid rgba(96,165,250,0.3); padding: 2px 6px; border-radius: 4px; color: var(--blue); font-family: var(--mono); display: inline-block; margin: 1px; }
.empty { font-size: 10px; color: var(--ink-dim); }

.card-footer { font-size: 10px; color: var(--ink-dim); text-align: right; }

.unregistered {
  color: var(--ink-dim);
  font-size: 12px;
  text-align: center;
  padding: 16px 0;
}

.loading { text-align: center; padding: 48px; color: var(--ink-dim); font-size: 14px; }
.error { text-align: center; padding: 48px; color: var(--pink); font-size: 14px; }

/* Auto-refresh indicator */
.refresh-indicator {
  font-size: 10px;
  color: var(--ink-dim);
  margin-left: 8px;
}
</style>
</head>
<body>

<div class="header">
  <h1>TESTER DASHBOARD</h1>
  <div class="summary-bar">
    <span>Keys: <strong id="stat-keys">—</strong></span>
    <span>Registered: <strong id="stat-registered">—</strong></span>
    <span>Active Now: <strong id="stat-active">—</strong></span>
    <span>Total Loops: <strong id="stat-loops">—</strong></span>
    <button class="btn" onclick="refresh()">↻ Refresh</button>
    <span class="refresh-indicator" id="last-refresh"></span>
  </div>
</div>

<div class="grid" id="tester-grid">
  <div class="loading">Loading tester status...</div>
</div>

<script>
const API_BASE = window.location.origin;

function getInviteKey() {
  try {
    const url = new URLSearchParams(window.location.search).get('invite');
    if (url) return url;
    return localStorage.getItem('mythos_invite') || '';
  } catch { return ''; }
}

function relativeTime(iso) {
  if (!iso) return '—';
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function renderCard(t) {
  const isActive = t.active_loops > 0;
  const dotClass = isActive ? 'dot active' : 'dot';

  if (!t.registered) {
    return `
      <div class="card">
        <div class="card-header">
          <div class="card-name">
            <div class="${dotClass}"></div>
            <div><div class="key">${t.invite_key}</div></div>
          </div>
          <span class="chip chip-pink">NOT REGISTERED</span>
        </div>
        <div class="unregistered">Key distributed but unused</div>
      </div>`;
  }

  let activeLoopHtml = '';
  if (t.active_loop) {
    const al = t.active_loop;
    const stabColor = al.stability < 30 ? 'var(--pink)' : 'var(--green)';
    const tensColor = al.tension > 70 ? 'var(--pink)' : 'var(--amber)';
    activeLoopHtml = `
      <div class="active-loop">
        <div class="active-loop-title">▸ ACTIVE LOOP</div>
        <div class="detail-grid">
          <span class="label">Location:</span><span class="value">${al.location}</span>
          <span class="label">Turn:</span><span class="value">${al.turn_index}</span>
          <span class="label">Stability:</span><span class="value" style="color:${stabColor}">${al.stability}</span>
          <span class="label">Tension:</span><span class="value" style="color:${tensColor}">${al.tension}</span>
          <span class="label">Phase:</span><span class="value" style="color:var(--blue)">${al.phase}</span>
        </div>
      </div>`;
  }

  const endingsHtml = t.endings_reached.length > 0
    ? t.endings_reached.map(e => `<div class="ending-item">• ${e.ending_label} (${e.turns} turns)</div>`).join('')
    : '<span class="empty">None yet</span>';

  const alliesHtml = t.allies_met.length > 0
    ? t.allies_met.map(a => `<span class="ally-chip">${a}</span>`).join('')
    : '<span class="empty">None yet</span>';

  return `
    <div class="card">
      <div class="card-header">
        <div class="card-name">
          <div class="${dotClass}"></div>
          <div>
            <div class="name">${t.display_name || t.invite_key}</div>
            <div class="key">${t.invite_key}</div>
          </div>
        </div>
        <div>${t.archetype ? `<span class="chip chip-blue">${t.archetype}</span>` : ''}</div>
      </div>

      <div class="stats-row">
        <div class="stat-box"><span class="stat-label">Loops</span><span class="stat-value">${t.total_loops}</span></div>
        <div class="stat-box"><span class="stat-label">Active</span><span class="stat-value" style="color:${isActive ? 'var(--green)' : 'var(--ink-dim)'}">${t.active_loops}</span></div>
        <div class="stat-box"><span class="stat-label">Ended</span><span class="stat-value">${t.ended_loops}</span></div>
        <div class="stat-box"><span class="stat-label">Max Turn</span><span class="stat-value">${t.max_turn}</span></div>
        <div class="stat-box"><span class="stat-label">Wins</span><span class="stat-value" style="color:var(--green)">${t.combats_won}</span></div>
        <div class="stat-box"><span class="stat-label">Losses</span><span class="stat-value" style="color:var(--pink)">${t.combats_lost}</span></div>
        <div class="stat-box"><span class="stat-label">Runs</span><span class="stat-value">${t.total_runs_completed}</span></div>
      </div>

      ${activeLoopHtml}

      <div class="endings-allies">
        <div>
          <div class="section-title">Endings Reached</div>
          <div class="mini-panel">${endingsHtml}</div>
        </div>
        <div>
          <div class="section-title">Allies Met</div>
          <div class="mini-panel">${alliesHtml}</div>
        </div>
      </div>

      <div class="card-footer">
        Last activity: ${relativeTime(t.last_activity)}${t.created_at ? ' · Joined: ' + new Date(t.created_at).toLocaleDateString() : ''}
      </div>
    </div>`;
}

async function refresh() {
  const grid = document.getElementById('tester-grid');
  const key = getInviteKey();
  try {
    const res = await fetch(API_BASE + '/api/v1/admin/tester-status', {
      headers: key ? { 'X-Invite-Key': key } : {}
    });
    if (res.status === 403) {
      grid.innerHTML = '<div class="error">Access denied — admin key required.<br><br>Append <code>?invite=YOUR_ADMIN_KEY</code> to the URL.</div>';
      return;
    }
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();

    // Update summary
    const registered = data.testers.filter(t => t.registered).length;
    const active = data.testers.filter(t => t.active_loops > 0).length;
    const totalLoops = data.testers.reduce((s, t) => s + t.total_loops, 0);
    document.getElementById('stat-keys').textContent = data.total_keys;
    document.getElementById('stat-registered').textContent = registered;
    document.getElementById('stat-active').textContent = active;
    document.getElementById('stat-loops').textContent = totalLoops;

    // Render cards
    grid.innerHTML = data.testers.map(renderCard).join('');

    document.getElementById('last-refresh').textContent = 'Updated: ' + new Date().toLocaleTimeString();
  } catch (e) {
    grid.innerHTML = `<div class="error">Failed to load: ${e.message}</div>`;
  }
}

// Initial load + auto-refresh every 30s
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
