<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>세계 : 접속 — MythOS API PoC</title>
  <style>
    /* Palette aligned with streamlit_app.py: near-black + green terminal accent,
       scanline overlay, glow borders, SF Mono. (See docs/plans/2026-06-03-poc-ux-improvement.md) */
    :root {
      --term: #8fffea;
      --term-dim: rgba(41, 255, 198, 0.72);
      --bg: #020706;
      --panel: rgba(0, 20, 17, 0.78);
      --panel-2: rgba(0, 14, 12, 0.82);
      --line: rgba(41, 255, 198, 0.30);
      --line-soft: rgba(41, 255, 198, 0.16);
      --ink: #d6fff6;
      --ink-dim: #6fa99b;
      --warn: #ffd76a;
      --danger: #ff6b7d;
      --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--mono);
      line-height: 1.7;
      background:
        linear-gradient(180deg, rgba(0, 9, 10, 0.94), rgba(0, 0, 0, 0.98)),
        repeating-linear-gradient(0deg,
          rgba(0, 255, 170, 0.05) 0, rgba(0, 255, 170, 0.05) 1px,
          transparent 1px, transparent 4px);
    }

    /* Header */
    header {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding: 12px 22px; border-bottom: 1px solid var(--line-soft);
      background: var(--bg);
    }
    header .brand { display: flex; flex-direction: column; }
    header h1 { margin: 0; font-size: 14px; letter-spacing: 3px; color: var(--term); text-transform: uppercase; }
    header .sub { color: var(--ink-dim); font-size: 11px; letter-spacing: 1px; }
    header .spacer { flex: 1; }
    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .controls label { display: flex; align-items: center; gap: 6px; color: var(--ink-dim); font-size: 12px; }
    input[type=text] {
      background: #06120f; color: var(--ink); border: 1px solid var(--line);
      border-radius: 4px; padding: 7px 9px; font: inherit; min-width: 150px;
    }
    button {
      background: linear-gradient(135deg, rgba(41, 255, 198, 0.12), transparent 60%), var(--panel-2);
      color: var(--term); border: 1px solid var(--line); border-radius: 4px;
      padding: 8px 14px; font: inherit; cursor: pointer; letter-spacing: 1px;
      transition: box-shadow .18s ease, background .18s ease;
    }
    button:hover:not(:disabled) { box-shadow: 0 0 18px rgba(41, 255, 198, 0.22); }
    button:disabled { opacity: 0.4; cursor: default; }

    /* Layout: main narrative column + fixed aside (centered on wide screens) */
    main { display: grid; grid-template-columns: 1fr 340px; gap: 18px; padding: 18px 22px; align-items: start; max-width: 1320px; margin: 0 auto; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    @media (max-width: 560px) {
      header { padding: 10px 14px; gap: 10px; }
      main { padding: 14px; }
      .controls input[type=text] { min-width: 110px; }
      #narration { font-size: 14.5px; }
    }
    /* Thin terminal scrollbar */
    #log::-webkit-scrollbar { width: 8px; }
    #log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
    #log-panel summary::-webkit-details-marker { display: none; }
    #log-panel summary { margin-bottom: 0; }
    #log-panel[open] summary { margin-bottom: 10px; }
    .panel {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 6px; box-shadow: 0 0 22px rgba(0, 255, 170, 0.07); padding: 16px;
    }
    .panel + .panel { margin-top: 16px; }
    .panel-title {
      font-size: 11px; letter-spacing: 2px; color: var(--term-dim);
      text-transform: uppercase; margin: 0 0 10px;
    }

    /* Scene */
    #status { font-size: 12px; color: var(--ink-dim); margin-bottom: 12px; min-height: 16px; }
    #scene-title { color: var(--term); font-size: 18px; letter-spacing: 1px; margin: 0 0 12px; }
    #narration { white-space: pre-wrap; max-width: 70ch; font-size: 15.5px; }
    #narration .caret { color: var(--term); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* Choice command-cards */
    #choices { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
    .command-card {
      position: relative; overflow: hidden; text-align: left; width: 100%;
      background: linear-gradient(135deg, rgba(41, 255, 198, 0.08), transparent 42%), var(--panel-2);
      border: 1px solid var(--line); border-radius: 5px; padding: 12px 14px;
      color: var(--ink); cursor: pointer; transition: box-shadow .18s ease, border-color .18s ease;
    }
    .command-card::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.6;
      background: repeating-linear-gradient(90deg, transparent 0, transparent 15px,
        rgba(41, 255, 198, 0.06) 16px, transparent 17px);
    }
    .command-card:hover:not(:disabled) { border-color: var(--term); box-shadow: 0 0 20px rgba(41, 255, 198, 0.18); }
    .command-card:disabled { opacity: 0.45; cursor: default; }
    .cmd-hotkey { color: var(--term-dim); font-size: 11px; letter-spacing: 1px; margin-bottom: 6px; }
    .cmd-label { color: var(--term); font-size: 14.5px; }
    .cmd-intent { color: var(--ink-dim); font-size: 11px; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

    /* HUD gauges */
    .gauge { margin-bottom: 12px; }
    .gauge:last-child { margin-bottom: 0; }
    .gauge-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
    .gauge-head .k { color: var(--ink-dim); letter-spacing: 1px; }
    .gauge-head .v { color: var(--term); }
    .gauge-bar { height: 6px; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--line-soft); border-radius: 3px; overflow: hidden; }
    .gauge-fill { height: 100%; background: var(--term); transition: width .4s ease, background .4s ease; }
    .hud-meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--ink-dim); margin-bottom: 12px; }
    .hud-meta b { color: var(--ink); }

    /* Image panel: size-controlled, framed (not full-bleed) */
    .image-frame {
      position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 5px;
      border: 1px solid var(--line-soft); background: rgba(0, 5, 4, 0.6); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .image-frame img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s ease; }
    .image-frame img.shown { opacity: 1; }
    .image-ph { position: absolute; color: var(--ink-dim); font-size: 12px; letter-spacing: 1px; text-align: center; padding: 0 12px; }
    #combat { width: 100%; border: 1px solid var(--line-soft); border-radius: 5px; display: none; margin-top: 12px; background: #030a08; }

    /* Combat controls */
    #combat-controls { margin-top: 16px; }
    #combat-controls.active { border-top: 1px solid var(--line-soft); padding-top: 14px; }
    .combat-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 12px; }
    .combat-bar .turn { color: var(--term); letter-spacing: 1px; }
    .combat-bar .focus { color: var(--ink-dim); }
    .cc-section { margin-bottom: 10px; }
    .cc-label { font-size: 10px; letter-spacing: 2px; color: var(--term-dim); text-transform: uppercase; margin-bottom: 6px; }
    .cc-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .cc-btn {
      background: var(--panel-2); color: var(--term); border: 1px solid var(--line);
      border-radius: 4px; padding: 7px 11px; font: inherit; font-size: 12.5px; cursor: pointer;
      letter-spacing: 0.5px; transition: box-shadow .15s ease, border-color .15s ease;
    }
    .cc-btn:hover:not(:disabled) { border-color: var(--term); box-shadow: 0 0 14px rgba(41,255,198,0.18); }
    .cc-btn:disabled { opacity: 0.35; cursor: default; }
    .cc-btn.sel { border-color: var(--warn); color: var(--warn); box-shadow: 0 0 12px rgba(255,215,106,0.25); }
    .cc-btn.danger { color: var(--danger); border-color: rgba(255,107,125,0.5); }
    .cc-hint { font-size: 11px; color: var(--ink-dim); margin-top: 4px; }
    .combat-outcome {
      margin-top: 8px; padding: 12px 14px; border-radius: 5px; border: 1px solid var(--line);
      background: rgba(41,255,198,0.06); color: var(--term);
    }
    .combat-outcome.lose { border-color: rgba(255,107,125,0.5); background: rgba(255,107,125,0.08); color: var(--danger); }

    /* Log */
    #log { font-size: 11px; color: var(--ink-dim); white-space: pre-wrap; max-height: 180px; overflow: auto; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>세계 : 접속</h1>
      <span class="sub">MythOS API PoC · REST + WebSocket + presigned</span>
    </div>
    <div class="spacer"></div>
    <div class="controls">
      <input type="text" id="display-name" placeholder="플레이어 이름" value="테스터" />
      <label><input type="checkbox" id="fallback" checked /> fallback</label>
      <label><input type="checkbox" id="with-image" /> 이미지</label>
      <button id="start">접속 · 루프 시작</button>
    </div>
  </header>

  <main>
    <section>
      <div class="panel">
        <div id="status">대기 중.</div>
        <h2 id="scene-title"></h2>
        <div id="narration"></div>
        <div id="choices"></div>
        <div id="combat-controls"></div>
      </div>
    </section>

    <aside>
      <div class="panel">
        <p class="panel-title">상태</p>
        <div class="hud-meta" id="hud-meta"></div>
        <div class="gauge">
          <div class="gauge-head"><span class="k">STABILITY</span><span class="v" id="g-stab-v">—</span></div>
          <div class="gauge-bar"><div class="gauge-fill" id="g-stab"></div></div>
        </div>
        <div class="gauge">
          <div class="gauge-head"><span class="k">TENSION</span><span class="v" id="g-tens-v">—</span></div>
          <div class="gauge-bar"><div class="gauge-fill" id="g-tens"></div></div>
        </div>
      </div>

      <div class="panel">
        <p class="panel-title">장면 이미지</p>
        <div class="image-frame">
          <div class="image-ph" id="image-ph">이미지 토글을 켜고 접속하면 장면 이미지가 생성됩니다.</div>
          <img id="scene-img" alt="scene" />
        </div>
        <canvas id="combat" width="320" height="240"></canvas>
      </div>

      <details class="panel" id="log-panel">
        <summary class="panel-title" style="cursor:pointer; list-style:none;">로그 ▾</summary>
        <div id="log"></div>
      </details>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
