apply plugin: 'com.android.application'

// Release signing (upload key, owner-held): android/keystore.properties (gitignored) with storeFile, storePassword,
// keyAlias, keyPassword — or another file via -PkeystoreProperties=<path>. Without it the release build is
// unsigned, exactly as before. scripts/android/build-aab.sh refuses to run without one.
def ksFile = project.hasProperty('keystoreProperties') ? file(project.property('keystoreProperties')) : rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace = "com.projectmythos.signalrun"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.projectmythos.signalrun"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play needs a strictly increasing versionCode per upload: pass -PversionCode=N (scripts/android/build-apk.sh).
        versionCode((project.findProperty('versionCode') ?: '1') as Integer)
        versionName((project.findProperty('versionName') ?: '2.0.0') as String)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (ksFile.exists()) {
            release {
                storeFile file(ks.getProperty('storeFile'))
                storePassword ks.getProperty('storePassword')
                keyAlias ks.getProperty('keyAlias')
                keyPassword ks.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (ksFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.android.billingclient:billing:8.0.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Firebase (Crashlytics): google-services.json is per-project and gitignored — fetch it with
// scripts/android/fetch-firebase-config.sh. Without it the app still builds and runs, minus crash reports.
def servicesJSON = file('google-services.json')
if (servicesJSON.exists() && servicesJSON.text) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
} else {
    logger.warn("google-services.json not found: Firebase/Crashlytics disabled for this build (run scripts/android/fetch-firebase-config.sh)")
}
